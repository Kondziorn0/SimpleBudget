<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(
        pageTitle='Logowanie - SimpleBudget',
        contentTemplate=~{:: content}
      )}"
>
  <head></head>
  <body>
    <div th:fragment="content">
      <div class="flex justify-center py-6 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
          <!-- Header -->
          <div class="text-center">
            <div
              class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-primary-100"
            >
              <i class="fas fa-sign-in-alt text-primary-600 text-xl"></i>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
              Zaloguj się do konta
            </h2>
            <p class="mt-2 text-sm text-gray-600">
              Lub
              <a
                th:href="@{/register}"
                class="font-medium text-primary-600 hover:text-primary-500"
              >
                zarejestruj nowe konto
              </a>
            </p>
          </div>

          <!-- Messages -->
          <div th:if="${errorMessage}" class="rounded-md bg-red-50 p-4">
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="fas fa-exclamation-circle text-red-400"></i>
              </div>
              <div class="ml-3">
                <h3
                  class="text-sm font-medium text-red-800"
                  th:text="${errorMessage}"
                ></h3>
              </div>
            </div>
          </div>

          <div th:if="${successMessage}" class="rounded-md bg-green-50 p-4">
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="fas fa-check-circle text-green-400"></i>
              </div>
              <div class="ml-3">
                <h3
                  class="text-sm font-medium text-green-800"
                  th:text="${successMessage}"
                ></h3>
              </div>
            </div>
          </div>

          <!-- Login Form -->
          <div class="bg-white py-8 px-6 shadow rounded-lg">
            <form class="space-y-6" th:action="@{/login}" method="post">
              <div>
                <label
                  for="username"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-user text-gray-400 mr-2"></i>
                  Nazwa użytkownika
                </label>
                <div class="mt-1">
                  <input
                    id="username"
                    name="username"
                    type="text"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
                    placeholder="Wprowadź nazwę użytkownika"
                  />
                </div>
              </div>

              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-lock text-gray-400 mr-2"></i>
                  Hasło
                </label>
                <div class="mt-1">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
                    placeholder="Wprowadź hasło"
                  />
                </div>
              </div>

              <div class="flex items-center justify-between">
                <div class="flex items-center">
                  <input
                    id="remember_me"
                    name="remember-me"
                    type="checkbox"
                    class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded"
                  />
                  <label
                    for="remember_me"
                    class="ml-2 block text-sm text-gray-900"
                  >
                    Zapamiętaj mnie
                  </label>
                </div>
              </div>

              <div>
                <button
                  type="submit"
                  class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
                >
                  <span
                    class="absolute left-0 inset-y-0 flex items-center pl-3"
                  >
                    <i
                      class="fas fa-sign-in-alt text-primary-500 group-hover:text-primary-400"
                    ></i>
                  </span>
                  Zaloguj się
                </button>
              </div>
            </form>
          </div>

          <!-- Additional Links -->
          <div class="text-center">
            <p class="text-sm text-gray-600">
              Nie masz konta?
              <a
                th:href="@{/register}"
                class="font-medium text-primary-600 hover:text-primary-500"
              >
                Zarejestruj się tutaj
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
