<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(
        pageTitle='Rejestracja - SimpleBudget',
        contentTemplate=~{:: content}
      )}"
>
  <head></head>
  <body>
    <div th:fragment="content">
      <div class="flex justify-center py-6 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
          <!-- Header -->
          <div class="text-center">
            <div
              class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-primary-100"
            >
              <i class="fas fa-user-plus text-primary-600 text-xl"></i>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
              Utwórz nowe konto
            </h2>
            <p class="mt-2 text-sm text-gray-600">
              Lub
              <a
                th:href="@{/login}"
                class="font-medium text-primary-600 hover:text-primary-500"
              >
                zaloguj się do istniejącego konta
              </a>
            </p>
          </div>

          <!-- Messages -->
          <div th:if="${errorMessage}" class="rounded-md bg-red-50 p-4">
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="fas fa-exclamation-circle text-red-400"></i>
              </div>
              <div class="ml-3">
                <h3
                  class="text-sm font-medium text-red-800"
                  th:text="${errorMessage}"
                ></h3>
              </div>
            </div>
          </div>

          <!-- Registration Form -->
          <div class="bg-white py-8 px-6 shadow rounded-lg">
            <form
              class="space-y-6"
              th:action="@{/register}"
              th:object="${userRegistrationDto}"
              method="post"
            >
              <!-- Username -->
              <div>
                <label
                  for="username"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-user text-gray-400 mr-2"></i>
                  Nazwa użytkownika *
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{username}"
                    type="text"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('username')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="np. jan_kowalski"
                  />
                  <div
                    th:if="${#fields.hasErrors('username')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{username}"></span>
                  </div>
                </div>
              </div>

              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-envelope text-gray-400 mr-2"></i>
                  Adres email *
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{email}"
                    type="email"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('email')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="jan@example.com"
                  />
                  <div
                    th:if="${#fields.hasErrors('email')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{email}"></span>
                  </div>
                </div>
              </div>

              <!-- First Name -->
              <div>
                <label
                  for="firstName"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-id-card text-gray-400 mr-2"></i>
                  Imię
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{firstName}"
                    type="text"
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('firstName')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="Jan"
                  />
                  <div
                    th:if="${#fields.hasErrors('firstName')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{firstName}"></span>
                  </div>
                </div>
              </div>

              <!-- Last Name -->
              <div>
                <label
                  for="lastName"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-id-card text-gray-400 mr-2"></i>
                  Nazwisko
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{lastName}"
                    type="text"
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('lastName')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="Kowalski"
                  />
                  <div
                    th:if="${#fields.hasErrors('lastName')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{lastName}"></span>
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-lock text-gray-400 mr-2"></i>
                  Hasło *
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{password}"
                    type="password"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('password')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="Minimum 6 znaków"
                  />
                  <div
                    th:if="${#fields.hasErrors('password')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{password}"></span>
                  </div>
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="confirmPassword"
                  class="block text-sm font-medium text-gray-700"
                >
                  <i class="fas fa-lock text-gray-400 mr-2"></i>
                  Potwierdź hasło *
                </label>
                <div class="mt-1">
                  <input
                    th:field="*{confirmPassword}"
                    type="password"
                    required
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                    placeholder="Powtórz hasło"
                  />
                  <div
                    th:if="${#fields.hasErrors('confirmPassword')}"
                    class="mt-2 text-sm text-red-600"
                  >
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span th:errors="*{confirmPassword}"></span>
                  </div>
                </div>
              </div>

              <!-- Submit Button -->
              <div>
                <button
                  type="submit"
                  class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
                >
                  <span
                    class="absolute left-0 inset-y-0 flex items-center pl-3"
                  >
                    <i
                      class="fas fa-user-plus text-primary-500 group-hover:text-primary-400"
                    ></i>
                  </span>
                  Zarejestruj się
                </button>
              </div>

              <!-- Required fields note -->
              <div class="text-center">
                <p class="text-xs text-gray-500">* - pola wymagane</p>
              </div>
            </form>
          </div>

          <!-- Additional Links -->
          <div class="text-center">
            <p class="text-sm text-gray-600">
              Masz już konto?
              <a
                th:href="@{/login}"
                class="font-medium text-primary-600 hover:text-primary-500"
              >
                Zaloguj się tutaj
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
