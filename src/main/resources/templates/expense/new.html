<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(
        pageTitle='Kategorie wydatków - SimpleBudget',
        contentTemplate=~{:: content}
      )}"
>
  <head></head>
  <body>
    <div th:fragment="content">
      <!-- Main Content -->
      <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl">
            <i class="fas fa-minus text-red-600 mr-2"></i>
            Dodaj nowy wydatek
          </h1>
          <p class="mt-1 text-sm text-gray-500">
            Wprowadź szczegóły swojego nowego wydatku
          </p>
        </div>

        <!-- Form -->
        <div class="bg-white shadow rounded-lg">
          <form
            th:action="@{/expense/new}"
            th:object="${expenseRequest}"
            method="post"
            class="space-y-6 p-6"
          >
            <!-- Name Field -->
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-signature text-gray-400 mr-1"></i>
                Nazwa wydatku
              </label>
              <input
                type="text"
                th:field="*{name}"
                id="name"
                placeholder="np. Zakupy spożywcze, Paliwo, Restauracja..."
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500"
                th:classappend="${#fields.hasErrors('name')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              />
              <div
                th:if="${#fields.hasErrors('name')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{name}"></span>
              </div>
            </div>

            <!-- Amount Field -->
            <div>
              <label
                for="amount"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-money-bill-wave text-gray-400 mr-1"></i>
                Kwota (PLN)
              </label>
              <div class="relative">
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  th:field="*{amount}"
                  id="amount"
                  placeholder="0,00"
                  class="block w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500"
                  th:classappend="${#fields.hasErrors('amount')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
                />
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <span class="text-gray-500 text-sm">zł</span>
                </div>
              </div>
              <div
                th:if="${#fields.hasErrors('amount')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{amount}"></span>
              </div>
            </div>

            <!-- Description Field -->
            <div>
              <label
                for="description"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-comment-alt text-gray-400 mr-1"></i>
                Opis (opcjonalny)
              </label>
              <textarea
                th:field="*{description}"
                id="description"
                rows="3"
                placeholder="Dodatkowe informacje o wydatku..."
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500 resize-none"
                th:classappend="${#fields.hasErrors('description')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              ></textarea>
              <div
                th:if="${#fields.hasErrors('description')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{description}"></span>
              </div>
            </div>

            <!-- Date Field -->
            <div>
              <label
                for="timeWhenHappened"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-calendar text-gray-400 mr-1"></i>
                Data wydatku
              </label>
              <input
                type="date"
                th:field="*{timeWhenHappened}"
                id="timeWhenHappened"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                th:classappend="${#fields.hasErrors('timeWhenHappened')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              />
              <div
                th:if="${#fields.hasErrors('timeWhenHappened')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{timeWhenHappened}"></span>
              </div>
            </div>

            <!-- Category Field -->
            <div>
              <label
                for="expenseCategoryId"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-tag text-gray-400 mr-1"></i>
                Kategoria wydatku
              </label>
              <select
                th:field="*{expenseCategoryId}"
                id="expenseCategoryId"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                th:classappend="${#fields.hasErrors('expenseCategoryId')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              >
                <option value="">Wybierz kategorię...</option>
                <option
                  th:each="category : ${expenseCategories}"
                  th:value="${category.id}"
                  th:text="${category.name}"
                ></option>
              </select>
              <div
                th:if="${#fields.hasErrors('expenseCategoryId')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{expenseCategoryId}"></span>
              </div>
              <div th:if="${#lists.isEmpty(expenseCategories)}" class="mt-2">
                <div class="rounded-md bg-yellow-50 p-4">
                  <div class="flex">
                    <div class="flex-shrink-0">
                      <i
                        class="fas fa-exclamation-triangle text-yellow-400"
                      ></i>
                    </div>
                    <div class="ml-3">
                      <h3 class="text-sm font-medium text-yellow-800">
                        Brak kategorii wydatków
                      </h3>
                      <div class="mt-2 text-sm text-yellow-700">
                        <p>Musisz najpierw utworzyć kategorię wydatku.</p>
                      </div>
                      <div class="mt-4">
                        <a
                          th:href="@{/expense-categories/new}"
                          class="inline-flex items-center px-3 py-1 border border-transparent text-sm leading-4 font-medium rounded-md text-yellow-800 bg-yellow-200 hover:bg-yellow-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-colors"
                        >
                          <i class="fas fa-plus mr-1"></i>
                          Dodaj kategorię
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div
              class="flex justify-end space-x-3 pt-6 border-t border-gray-200"
            >
              <a
                th:href="@{/expense}"
                class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
              >
                <i class="fas fa-times mr-2"></i>
                Anuluj
              </a>
              <button
                type="submit"
                class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors"
              >
                <i class="fas fa-save mr-2"></i>
                Zapisz wydatek
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Set today's date as default
      document.addEventListener('DOMContentLoaded', function () {
        const dateInput = document.getElementById('timeWhenHappened');
        if (!dateInput.value) {
          const today = new Date().toISOString().split('T')[0];
          dateInput.value = today;
        }
      });
    </script>
  </body>
</html>
