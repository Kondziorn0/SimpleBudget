<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(
        pageTitle='Kategorie wydatków - SimpleBudget',
        contentTemplate=~{:: content}
      )}"
>
  <head></head>
  <body>
    <div th:fragment="content">
      <!-- Main Content -->
      <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl">
            <i class="fas fa-tag text-blue-600 mr-2"></i>
            Dodaj kategorię dochodu
          </h1>
          <p class="mt-1 text-sm text-gray-500">
            Utwórz nową kategorię dla swoich dochodów
          </p>
        </div>

        <!-- Form -->
        <div class="bg-white shadow rounded-lg">
          <form
            th:action="@{/income-categories/new}"
            th:object="${incomeCategoryRequest}"
            method="post"
            class="space-y-6 p-6"
          >
            <!-- Name Field -->
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-signature text-gray-400 mr-1"></i>
                Nazwa kategorii
                <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                th:field="*{name}"
                id="name"
                placeholder="np. Wynagrodzenie, Freelancing, Inwestycje..."
                required
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                th:classappend="${#fields.hasErrors('name')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              />
              <div
                th:if="${#fields.hasErrors('name')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{name}"></span>
              </div>
            </div>

            <!-- Description Field -->
            <div>
              <label
                for="description"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                <i class="fas fa-comment-alt text-gray-400 mr-1"></i>
                Opis (opcjonalny)
              </label>
              <textarea
                th:field="*{description}"
                id="description"
                rows="4"
                placeholder="Opisz szczegóły tej kategorii dochodów..."
                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 resize-none"
                th:classappend="${#fields.hasErrors('description')} ? 'border-red-300 ring-red-500 focus:ring-red-500 focus:border-red-500' : ''"
              ></textarea>
              <div
                th:if="${#fields.hasErrors('description')}"
                class="mt-2 text-sm text-red-600"
              >
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span th:errors="*{description}"></span>
              </div>
              <p class="mt-2 text-sm text-gray-500">
                <i class="fas fa-info-circle mr-1"></i>
                Opis pomoże Ci w łatwiejszym rozpoznawaniu kategorii
              </p>
            </div>

            <!-- Example Categories -->
            <div class="bg-blue-50 rounded-lg p-4">
              <h4 class="text-sm font-medium text-blue-900 mb-2">
                <i class="fas fa-lightbulb mr-1"></i>
                Przykłady kategorii dochodów:
              </h4>
              <div
                class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-blue-700"
              >
                <div class="flex items-center">
                  <i class="fas fa-briefcase mr-2"></i>
                  Wynagrodzenie podstawowe
                </div>
                <div class="flex items-center">
                  <i class="fas fa-gift mr-2"></i>
                  Premie i bonusy
                </div>
                <div class="flex items-center">
                  <i class="fas fa-laptop-code mr-2"></i>
                  Freelancing
                </div>
                <div class="flex items-center">
                  <i class="fas fa-chart-line mr-2"></i>
                  Inwestycje
                </div>
                <div class="flex items-center">
                  <i class="fas fa-home mr-2"></i>
                  Wynajem nieruchomości
                </div>
                <div class="flex items-center">
                  <i class="fas fa-graduation-cap mr-2"></i>
                  Stypendia
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div
              class="flex justify-end space-x-3 pt-6 border-t border-gray-200"
            >
              <a
                th:href="@{/income-categories}"
                class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors"
              >
                <i class="fas fa-times mr-2"></i>
                Anuluj
              </a>
              <button
                type="submit"
                class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
              >
                <i class="fas fa-save mr-2"></i>
                Zapisz kategorię
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
